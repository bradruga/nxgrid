name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish WASM app
        run: dotnet publish samples/NxGrid.Demo.Wasm/NxGrid.Demo.Wasm.csproj -c Release -o publish

      - name: Fix base href for GitHub Pages subpath
        run: sed -i 's|<base href="/" />|<base href="/nxgrid/" />|' publish/wwwroot/index.html

      - name: Add 404.html for SPA deep-link fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      - name: Add .nojekyll to allow _framework/ to be served
        run: touch publish/wwwroot/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
